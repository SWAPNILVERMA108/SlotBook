# Runs on every push and every pull request: lint, security scan, tests with coverage, Docker build.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slotbook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    # The CI machine has no .env file. These variables replace it.
    env:
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789-abcdefghijklmnop
      DEBUG: "False"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/slotbook
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install packages
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan of our own code (bandit)
        run: bandit -r bookings payments users venues config -x "*/tests/*,*/tests.py,*/migrations/*" -q

      - name: Known vulnerabilities in our packages (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Are all model changes covered by migrations?
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Tests with coverage (fails below 90 percent)
        run: pytest --cov

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t slotbook:ci .
