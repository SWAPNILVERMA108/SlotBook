# Free Render Blueprint for the Dockerized Django API.
# Create one free Render Key Value instance in the dashboard and set REDIS_URL
# and CACHE_URL on this service. Key Value is intentionally not declared here
# because it is configured separately in Render.
services:
  - type: web
    name: slotbook-web
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Runs Gunicorn, Celery worker, and Celery Beat in one free service.
    dockerCommand: all
    healthCheckPath: /api/health/
    envVars: &app-env
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: HTTPS_ONLY
        value: "True"
      - key: BEHIND_PROXY
        value: "True"
      - key: NUM_PROXIES
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: slotbook-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CACHE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: slotbook-db
    databaseName: slotbook
    user: slotbook
    plan: free
