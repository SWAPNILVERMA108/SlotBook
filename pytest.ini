[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py tests.py
# The old tests live inside each app (bookings/tests, payments/tests, users/tests.py ...).
# The new pytest-style tests live in tests/ at the top.
testpaths = bookings payments users venues tests
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning:rest_framework_simplejwt
    # WhiteNoise warns when you have not run collectstatic yet. Harmless for tests (CI runs it anyway).
    ignore:No directory at:UserWarning
